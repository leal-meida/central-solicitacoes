<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel — Central de Solicitações</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:       #111318;
  --ink2:      #3a3f4a;
  --ink3:      #6b7280;
  --fog:       #f0f1f3;
  --fog2:      #e4e6ea;
  --white:     #ffffff;
  --blue:      #2563eb;
  --blue-l:    #eff4ff;
  --blue-b:    #bfcffd;
  --teal:      #0891b2;
  --teal-l:    #ecfeff;
  --amber:     #d97706;
  --amber-l:   #fffbeb;
  --amber-b:   #fde68a;
  --violet:    #7c3aed;
  --violet-l:  #f5f3ff;
  --green:     #16a34a;
  --green-l:   #f0fdf4;
  --green-b:   #bbf7d0;
  --red:       #dc2626;
  --red-l:     #fef2f2;
  --slate:     #475569;
  --r:         6px;
  --r-lg:      12px;
  --font:      'Inter', sans-serif;
  --mono:      'JetBrains Mono', monospace;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: var(--font); background: var(--fog); color: var(--ink); min-height: 100vh; }

/* Header */
.header {
  background: var(--white); border-bottom: 1px solid var(--fog2);
  padding: 0 2rem; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 34px; height: 34px; background: var(--blue); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: white; font-size: 16px;
}
.header h1 { font-size: 15px; font-weight: 600; }
.header-sub { font-size: 12px; color: var(--ink3); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }

/* Realtime indicator */
.rt-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); display: inline-block;
  animation: pulse 2s infinite;
}
.rt-dot.offline { background: var(--ink3); animation: none; }
@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: .4; }
}
.rt-label { font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 5px; }

/* Kanban */
.kanban-wrap { padding: 1.5rem 1rem; overflow-x: auto; }
.kanban-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px;
}
.kanban-header h2 { font-size: 15px; font-weight: 600; }
.filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filter-row select, .filter-row input {
  height: 34px; padding: 0 10px; font-size: 12px;
  width: auto; border-radius: var(--r); border: 1px solid var(--fog2); background: var(--white);
}
.board {
  display: grid;
  grid-template-columns: repeat(5, minmax(220px, 280px));
  gap: 12px; min-width: max-content; padding: 0 0.5rem;
}
.col { background: var(--fog); border-radius: var(--r-lg); padding: 12px; }
.col-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--fog2);
}
.col-title {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .4px; display: flex; align-items: center; gap: 6px;
}
.col-count {
  font-size: 11px; font-weight: 600; background: var(--white);
  padding: 2px 7px; border-radius: 20px; color: var(--ink3);
}
.col-sla { font-size: 10px; color: var(--ink3); margin-top: 2px; }

.col-aberto .col-header   { border-color: var(--blue); }
.col-aberto .col-title    { color: var(--blue); }
.col-analise .col-header  { border-color: var(--teal); }
.col-analise .col-title   { color: var(--teal); }
.col-pendente .col-header { border-color: var(--amber); }
.col-pendente .col-title  { color: var(--amber); }
.col-resolucao .col-header { border-color: var(--violet); }
.col-resolucao .col-title  { color: var(--violet); }
.col-concluido .col-header { border-color: var(--green); }
.col-concluido .col-title  { color: var(--green); }

/* Ticket card */
.ticket {
  background: var(--white); border: 1px solid var(--fog2);
  border-radius: var(--r); padding: 12px; margin-bottom: 8px;
  cursor: pointer; transition: box-shadow .15s, transform .1s; box-shadow: var(--shadow);
}
.ticket:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.ticket.new-ticket { animation: flashin .6s ease; }
@keyframes flashin {
  0% { background: #dbeafe; } 100% { background: var(--white); }
}
.ticket-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.ticket-id { font-family: var(--mono); font-size: 10px; color: var(--ink3); font-weight: 500; }
.ticket-urgency { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 20px; }
.urg-normal { background: var(--teal-l); color: var(--teal); }
.urg-alta   { background: var(--amber-l); color: var(--amber); }
.urg-critica { background: var(--red-l); color: var(--red); }
.ticket-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; line-height: 1.4; }
.ticket-merchant { font-size: 11px; color: var(--ink3); margin-bottom: 8px; }
.ticket-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ticket-type { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.type-comp { background: var(--blue-l); color: var(--blue); }
.type-reimb { background: var(--violet-l); color: var(--violet); }
.type-both { background: var(--fog2); color: var(--slate); }

.sla-bar-wrap { margin-top: 8px; }
.sla-label { font-size: 10px; color: var(--ink3); margin-bottom: 3px; display: flex; justify-content: space-between; }
.sla-bar { height: 4px; background: var(--fog2); border-radius: 2px; overflow: hidden; }
.sla-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.sla-ok { background: var(--green); }
.sla-warn { background: var(--amber); }
.sla-crit { background: var(--red); }

.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.pill-amber { background: var(--amber-l); color: var(--amber); }
.pill-gray  { background: var(--fog2); color: var(--slate); }

.empty-col { text-align: center; padding: 2rem 1rem; color: var(--ink3); font-size: 12px; }
.empty-col .ei { font-size: 24px; margin-bottom: 6px; }

/* Modal */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 200;
  align-items: center; justify-content: center; padding: 1rem;
}
.overlay.open { display: flex; }
.modal {
  background: var(--white); border-radius: var(--r-lg);
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: fadeup .2s ease;
}
@keyframes fadeup { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--fog2);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--ink3); font-size: 20px; line-height: 1; flex-shrink: 0; background: none; border: none; }
.modal-body { padding: 1.5rem; }
.modal-footer {
  padding: 1rem 1.5rem; border-top: 1px solid var(--fog2);
  display: flex; gap: 8px; justify-content: flex-end;
}

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
.detail-item .lbl { font-size: 11px; color: var(--ink3); margin-bottom: 3px; }
.detail-item .val { font-size: 13px; font-weight: 500; }
.detail-item .val.mono { font-family: var(--mono); font-size: 12px; }

.history { list-style: none; }
.history li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--fog); font-size: 12px; }
.history li:last-child { border-bottom: none; }
.history .htime { color: var(--ink3); white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.history .htext { color: var(--ink2); }

.status-pipeline { display: flex; align-items: center; margin: 1rem 0; overflow-x: auto; }
.sp-step { display: flex; align-items: center; flex-shrink: 0; }
.sp-dot {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--fog2); background: var(--white);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--ink3); flex-shrink: 0;
}
.sp-dot.done    { background: var(--green); border-color: var(--green); color: white; }
.sp-dot.current { background: var(--blue); border-color: var(--blue); color: white; }
.sp-name { font-size: 10px; color: var(--ink3); text-align: center; margin-top: 4px; white-space: nowrap; }
.sp-line { width: 24px; height: 2px; background: var(--fog2); flex-shrink: 0; }
.sp-line.done { background: var(--green); }
.sp-wrap { display: flex; flex-direction: column; align-items: center; }

.notif-box {
  background: var(--green-l); border: 1px solid var(--green-b); border-radius: var(--r);
  padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; margin-top: 12px;
}
.notif-box .nb-icon { font-size: 18px; flex-shrink: 0; }
.notif-box .nb-title { font-size: 12px; font-weight: 600; color: var(--green); margin-bottom: 2px; }
.notif-box .nb-body { font-size: 12px; color: var(--ink2); line-height: 1.5; }
.move-select { width: 100%; }

.btn {
  height: 40px; padding: 0 20px; border-radius: var(--r);
  border: 1px solid var(--fog2); background: var(--white); color: var(--ink);
  font-size: 13px; font-family: var(--font); font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: all .12s; white-space: nowrap;
}
.btn:hover { background: var(--fog); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
.btn-danger { background: var(--red-l); border-color: #fca5a5; color: var(--red); }
.btn-danger:hover { background: #fee2e2; }

/* Toast */
.toast {
  display: none; position: fixed; bottom: 2rem; right: 2rem;
  background: var(--ink); color: white; padding: 14px 20px;
  border-radius: var(--r-lg); font-size: 13px; box-shadow: var(--shadow-md);
  z-index: 999; max-width: 360px;
}
.toast.show { display: flex; align-items: flex-start; gap: 10px; animation: slideup .3s ease; }
@keyframes slideup { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.toast-icon { font-size: 18px; flex-shrink: 0; }
.toast-title { font-weight: 600; margin-bottom: 3px; }
.toast-body { font-size: 12px; opacity: .8; }

/* Lock screen */
.lock-screen {
  position: fixed; inset: 0; z-index: 999;
  background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
  display: flex; align-items: center; justify-content: center; padding: 2rem;
}
.lock-card {
  background: white; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center;
}
.lock-icon { font-size: 40px; margin-bottom: 1rem; }
.lock-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.lock-card p  { font-size: 13px; color: #6b7280; margin-bottom: 1.5rem; }
.lock-input {
  width: 100%; height: 42px; padding: 0 14px;
  border: 1.5px solid #e4e6ea; border-radius: 8px;
  font-size: 14px; font-family: 'Inter', sans-serif;
  margin-bottom: 10px; text-align: center; letter-spacing: 2px;
  transition: border-color .15s;
}
.lock-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.lock-input.shake { animation: shake .4s ease; border-color: #dc2626; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60%  { transform: translateX(-8px); }
  40%,80%  { transform: translateX(8px); }
}
.lock-btn {
  width: 100%; height: 42px; background: #2563eb; color: white;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s;
}
.lock-btn:hover { background: #1d4ed8; }
.lock-error { font-size: 12px; color: #dc2626; margin-top: 8px; min-height: 16px; }

/* Config banner */
.config-banner {
  background: #fef3c7; border: 1px solid #fde68a;
  padding: 12px 16px; font-size: 13px; color: #92400e;
  display: flex; align-items: center; gap: 8px;
}
</style>
</head>
<body>

<!-- Lock screen -->
<div class="lock-screen" id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Acesso restrito</h2>
    <p>Digite a senha para acessar o painel de tickets</p>
    <input class="lock-input" type="password" id="lock-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') checkPassword()"/>
    <button class="lock-btn" onclick="checkPassword()">Entrar</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<!-- Config warning - aparece se Supabase não estiver configurado -->
<div class="config-banner" id="config-banner" style="display:none">
  ⚠️ <strong>Supabase não configurado.</strong> Edite o arquivo e preencha SUPABASE_URL e SUPABASE_ANON_KEY. <a href="#" style="color:#92400e" onclick="document.getElementById('config-banner').style.display='none'">fechar</a>
</div>

<div class="header">
  <div class="header-left">
    <div class="logo">🎫</div>
    <div>
      <div style="font-size:15px;font-weight:600">Central de Solicitações</div>
      <div class="header-sub">Painel de tickets — acesso restrito</div>
    </div>
  </div>
  <div class="header-right">
    <div class="rt-label">
      <span class="rt-dot" id="rt-dot"></span>
      <span id="rt-label">Conectando...</span>
    </div>
    <button class="btn btn-sm" onclick="fetchTickets()">↻ Atualizar</button>
  </div>
</div>

<div class="kanban-wrap">
  <div class="kanban-header">
    <h2>📋 Painel de tickets <span id="cnt-all" style="font-size:13px;font-weight:400;color:var(--ink3)"></span></h2>
    <div class="filter-row">
      <input type="text" placeholder="Buscar ticket..." id="k-search" oninput="renderBoard()" style="width:180px"/>
      <select id="k-tipo" onchange="renderBoard()">
        <option value="">Todos os tipos</option>
        <option value="comp">Comprovante</option>
        <option value="reimb">Reembolso</option>
        <option value="both">Ambos</option>
      </select>
      <select id="k-urg" onchange="renderBoard()">
        <option value="">Todas urgências</option>
        <option value="normal">Normal</option>
        <option value="alta">Alta</option>
        <option value="critica">Crítica</option>
      </select>
    </div>
  </div>
  <div class="board" id="board">
    <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--ink3);font-size:13px">
      ⏳ Carregando tickets...
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:4px" id="m-id"></div>
        <h3 id="m-title"></h3>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-footer" id="m-footer"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-icon">✅</div>
  <div>
    <div class="toast-title" id="toast-title"></div>
    <div class="toast-body" id="toast-body"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// ⚙️  CONFIGURAÇÃO — preencha com seus dados do Supabase
// ─────────────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://dubbhrgqandxrfrtebbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1YmJocmdxYW5keHJmcnRlYmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ0OTksImV4cCI6MjEwMjkzMDQ5OX0.LWQpMDQDODn2WCQstNg0bdUnvEN7SJ9Az2cxb0cCTxU';
// ─────────────────────────────────────────────────────────────────────────────

let tickets = [];
let openTicketId = null;
let realtimeWs = null;

const COLS = [
  { id:'aberto',    label:'Aberto',          icon:'📥', sla:4,   slaLabel:'SLA: 4h úteis',  cls:'col-aberto' },
  { id:'analise',   label:'Em análise',       icon:'🔍', sla:24,  slaLabel:'SLA: 24h úteis', cls:'col-analise' },
  { id:'pendente',  label:'Pendente externo', icon:'⏳', sla:48,  slaLabel:'SLA: 48h úteis', cls:'col-pendente' },
  { id:'resolucao', label:'Em resolução',     icon:'⚙️', sla:24,  slaLabel:'SLA: 24h úteis', cls:'col-resolucao' },
  { id:'concluido', label:'Concluído',        icon:'✅', sla:null, slaLabel:'',               cls:'col-concluido' },
];

// ── Supabase REST ──────────────────────────────────────────────────────────
function sbHeaders() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function fetchTickets() {
  if (SUPABASE_URL === 'COLE_SUA_URL_AQUI') {
    document.getElementById('config-banner').style.display = 'flex';
    setOffline('Não configurado');
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets?order=created_at.desc`, {
      headers: sbHeaders()
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    // Normalizar: history pode vir como string ou objeto
    tickets = data.map(t => ({
      ...t,
      history: typeof t.history === 'string' ? JSON.parse(t.history) : (t.history || [])
    }));
    renderBoard();
    setOnline();
  } catch(e) {
    console.error('Erro ao buscar tickets:', e);
    setOffline('Erro de conexão');
  }
}

async function updateTicketCol(id, col, historyEntry) {
  const ticket = tickets.find(t => t.id === id);
  if (!ticket) return;

  const newHistory = [...(ticket.history || []), historyEntry];
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tickets?id=eq.${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: sbHeaders(),
    body: JSON.stringify({
      col,
      moved_at: new Date().toISOString(),
      history: JSON.stringify(newHistory)
    })
  });
  if (!res.ok) throw new Error(await res.text());
}

// ── Realtime via Supabase WebSocket ──────────────────────────────────────
function connectRealtime() {
  if (SUPABASE_URL === 'COLE_SUA_URL_AQUI') return;

  const wsUrl = SUPABASE_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SUPABASE_ANON_KEY + '&vsn=1.0.0';

  realtimeWs = new WebSocket(wsUrl);

  realtimeWs.onopen = () => {
    // Subscribing to the tickets table
    realtimeWs.send(JSON.stringify({
      topic: 'realtime:public:tickets',
      event: 'phx_join',
      payload: { config: { broadcast: { self: false }, presence: { key: '' } } },
      ref: '1'
    }));
    setOnline();
  };

  realtimeWs.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === 'INSERT') {
        const newTicket = msg.payload.record;
        newTicket.history = typeof newTicket.history === 'string'
          ? JSON.parse(newTicket.history) : (newTicket.history || []);
        tickets.unshift(newTicket);
        renderBoard();
        showToast('🆕 Novo ticket!', `${newTicket.id} — ${newTicket.merchant} (${newTicket.nome})`, 6000);
        // Flash no card após render
        setTimeout(() => {
          const el = document.querySelector(`[data-id="${newTicket.id}"]`);
          if (el) el.classList.add('new-ticket');
        }, 100);
      } else if (msg.event === 'UPDATE') {
        const updated = msg.payload.record;
        updated.history = typeof updated.history === 'string'
          ? JSON.parse(updated.history) : (updated.history || []);
        const idx = tickets.findIndex(t => t.id === updated.id);
        if (idx !== -1) tickets[idx] = updated;
        renderBoard();
      } else if (msg.event === 'DELETE') {
        tickets = tickets.filter(t => t.id !== msg.payload.old_record.id);
        renderBoard();
      }
    } catch {}
  };

  realtimeWs.onclose = () => {
    setOffline('Desconectado');
    // Reconectar após 5s
    setTimeout(connectRealtime, 5000);
  };

  realtimeWs.onerror = () => setOffline('Erro WS');
}

function setOnline() {
  document.getElementById('rt-dot').className = 'rt-dot';
  document.getElementById('rt-label').textContent = 'Tempo real ativo';
}
function setOffline(msg) {
  document.getElementById('rt-dot').className = 'rt-dot offline';
  document.getElementById('rt-label').textContent = msg || 'Offline';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtDate(ts) {
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function slaElapsed(ticket) {
  const col = COLS.find(c => c.id === ticket.col);
  if (!col || !col.sla) return null;
  const movedAt = ticket.moved_at ? new Date(ticket.moved_at).getTime() : new Date(ticket.created_at).getTime();
  const elapsed = (Date.now() - movedAt) / 3600000;
  return Math.min(elapsed / col.sla, 1);
}
function slaClass(pct) {
  if (pct < 0.5) return 'sla-ok';
  if (pct < 0.8) return 'sla-warn';
  return 'sla-crit';
}
function tipoLabel(t) { return { comp:'Comprovante', reimb:'Reembolso', both:'Ambos' }[t] || t; }
function tipoClass(t) { return { comp:'type-comp', reimb:'type-reimb', both:'type-both' }[t] || ''; }
function urgClass(u)  { return { normal:'urg-normal', alta:'urg-alta', critica:'urg-critica' }[u] || ''; }
function urgLabel(u)  { return { normal:'Normal', alta:'Alta', critica:'Crítica' }[u] || u; }

// ── Board render ───────────────────────────────────────────────────────────
function renderBoard() {
  const q = document.getElementById('k-search').value.toLowerCase();
  const fTipo = document.getElementById('k-tipo').value;
  const fUrg  = document.getElementById('k-urg').value;

  const filtered = tickets.filter(t =>
    (!q || t.id.toLowerCase().includes(q) || t.merchant.toLowerCase().includes(q) ||
           (t.ids||'').includes(q) || t.nome.toLowerCase().includes(q)) &&
    (!fTipo || t.tipo === fTipo) &&
    (!fUrg  || t.urgencia === fUrg)
  );

  const total = tickets.length;
  document.getElementById('cnt-all').textContent = total > 0 ? `(${total} ticket${total !== 1 ? 's' : ''})` : '';

  document.getElementById('board').innerHTML = COLS.map(col => {
    const colTickets = filtered.filter(t => t.col === col.id);
    return `<div class="col ${col.cls}">
      <div class="col-header">
        <div>
          <div class="col-title">${col.icon} ${col.label}</div>
          ${col.slaLabel ? `<div class="col-sla">${col.slaLabel}</div>` : ''}
        </div>
        <span class="col-count">${colTickets.length}</span>
      </div>
      ${colTickets.length === 0
        ? `<div class="empty-col"><div class="ei">📭</div>Sem tickets</div>`
        : colTickets.map(t => renderCard(t)).join('')}
    </div>`;
  }).join('');
}

function renderCard(t) {
  const slaPct = slaElapsed(t);
  const slaBarHtml = slaPct !== null ? `
    <div class="sla-bar-wrap">
      <div class="sla-label"><span>SLA</span><span>${Math.round(slaPct * 100)}%</span></div>
      <div class="sla-bar">
        <div class="sla-fill ${slaClass(slaPct)}" style="width:${Math.round(slaPct*100)}%"></div>
      </div>
    </div>` : '';

  return `<div class="ticket" data-id="${t.id}" onclick="openModal('${t.id}')">
    <div class="ticket-top">
      <span class="ticket-id">${t.id}</span>
      <span class="ticket-urgency ${urgClass(t.urgencia)}">${urgLabel(t.urgencia)}</span>
    </div>
    <div class="ticket-title">${tipoLabel(t.tipo)} — ${t.merchant}</div>
    <div class="ticket-merchant">${t.nome} · ${t.pais || '–'}</div>
    <div class="ticket-meta">
      <span class="ticket-type ${tipoClass(t.tipo)}">${tipoLabel(t.tipo)}</span>
      ${t.remessa ? `<span class="pill pill-amber">Remessa ${t.remessa}</span>` : ''}
      ${t.moeda ? `<span class="pill pill-gray">${t.moeda}</span>` : ''}
    </div>
    ${slaBarHtml}
  </div>`;
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(id) {
  const t = tickets.find(x => x.id === id);
  if (!t) return;
  openTicketId = id;

  document.getElementById('m-id').textContent = t.id;
  document.getElementById('m-title').textContent = `${tipoLabel(t.tipo)} — ${t.merchant}`;

  const colIdx = COLS.findIndex(c => c.id === t.col);
  const pipeline = COLS.map((c, i) => {
    const isDone = i < colIdx, isCur = i === colIdx;
    return `<div class="sp-step">
      <div class="sp-wrap">
        <div class="sp-dot ${isDone?'done':''} ${isCur?'current':''}">${isDone?'✓':i+1}</div>
        <div class="sp-name">${c.label}</div>
      </div>
      ${i < COLS.length-1 ? `<div class="sp-line ${isDone?'done':''}"></div>` : ''}
    </div>`;
  }).join('');

  const notifBox = t.col === 'concluido' ? `
    <div class="notif-box">
      <div class="nb-icon">📧</div>
      <div>
        <div class="nb-title">Ticket concluído</div>
        <div class="nb-body">✅ E-mail de retorno para <strong>${t.email}</strong></div>
      </div>
    </div>` : '';

  const hist = (t.history || []).map(h =>
    `<li><span class="htime">${fmtDate(h.t)}</span><span class="htext">${h.txt}</span></li>`
  ).reverse().join('');

  document.getElementById('m-body').innerHTML = `
    <div class="status-pipeline">${pipeline}</div>
    <div class="detail-grid">
      <div class="detail-item"><div class="lbl">Tipo</div><div class="val">${tipoLabel(t.tipo)}</div></div>
      <div class="detail-item"><div class="lbl">Urgência</div><div class="val"><span class="ticket-urgency ${urgClass(t.urgencia)}">${urgLabel(t.urgencia)}</span></div></div>
      <div class="detail-item"><div class="lbl">Solicitante</div><div class="val">${t.nome}</div></div>
      <div class="detail-item"><div class="lbl">E-mail</div><div class="val">${t.email}</div></div>
      <div class="detail-item"><div class="lbl">Merchant</div><div class="val">${t.merchant}</div></div>
      <div class="detail-item"><div class="lbl">País</div><div class="val">${t.pais || '–'}</div></div>
      <div class="detail-item"><div class="lbl">Valor</div><div class="val">${t.valor ? t.valor + ' ' + (t.moeda||'') : '–'}</div></div>
      <div class="detail-item"><div class="lbl">Adquirente</div><div class="val">${t.adq || '–'}</div></div>
      ${t.remessa ? `<div class="detail-item"><div class="lbl">Remessa</div><div class="val"><span class="pill pill-amber">Nº ${t.remessa}</span></div></div>` : ''}
      <div class="detail-item"><div class="lbl">Aberto em</div><div class="val">${fmtDate(t.created_at)}</div></div>
    </div>
    <div class="detail-item" style="margin-bottom:1rem">
      <div class="lbl">IDs</div><div class="val mono">${t.ids}</div>
    </div>
    <div class="detail-item" style="margin-bottom:1rem">
      <div class="lbl">Motivo</div>
      <div class="val" style="font-weight:400;line-height:1.5">${t.motivo}</div>
    </div>
    ${notifBox}
    <div style="margin-top:1.25rem">
      <div style="font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">Histórico</div>
      <ul class="history">${hist || '<li><span class="htext" style="color:var(--ink3)">Sem histórico</span></li>'}</ul>
    </div>`;

  const otherCols = COLS.filter(c => c.id !== t.col);
  document.getElementById('m-footer').innerHTML = t.col !== 'concluido'
    ? `<select class="btn move-select" id="move-sel" style="height:36px;font-size:13px">
        <option value="">Mover para...</option>
        ${otherCols.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="moveTicket()">Mover →</button>`
    : `<span style="font-size:12px;color:var(--green);font-weight:600">✅ Ticket concluído</span>`;

  document.getElementById('overlay').classList.add('open');
}

async function moveTicket() {
  const dest = document.getElementById('move-sel').value;
  if (!dest) return;
  const t = tickets.find(x => x.id === openTicketId);
  if (!t) return;
  const destCol = COLS.find(c => c.id === dest);

  try {
    const histEntry = { t: Date.now(), txt: `Movido para "${destCol.label}"` };
    await updateTicketCol(t.id, dest, histEntry);

    // Atualizar local otimisticamente
    t.col = dest;
    t.moved_at = new Date().toISOString();
    t.history = [...(t.history || []), histEntry];

    if (dest === 'concluido') {
      showToast('✅ Ticket concluído!', `${t.id} marcado como concluído.`, 5000);
    } else {
      showToast('↗️ Ticket movido', `${t.id} → ${destCol.label}`, 3000);
    }

    renderBoard();
    closeModal();
  } catch(e) {
    showToast('❌ Erro', 'Não foi possível mover o ticket. Tente novamente.', 4000);
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  openTicketId = null;
}

function showToast(title, body, ms) {
  const el = document.getElementById('toast');
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-body').textContent = body;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms || 4000);
}

// ── Senha ──────────────────────────────────────────────────────────────────
const SENHA_HASH = '43e7637d45e6e84e0aedbc27a74fd2d9f5cf2736e7a976e3c4c5aab0e2c1f2b0'; // Coritiba@1982

async function hashSenha(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const val = document.getElementById('lock-input').value;
  const hash = await hashSenha(val);
  if (hash === SENHA_HASH) {
    sessionStorage.setItem('kanban_auth', '1');
    document.getElementById('lock-screen').style.display = 'none';
    fetchTickets();
    connectRealtime();
  } else {
    const input = document.getElementById('lock-input');
    const err   = document.getElementById('lock-error');
    input.classList.add('shake');
    err.textContent = 'Senha incorreta. Tente novamente.';
    input.value = '';
    setTimeout(() => input.classList.remove('shake'), 400);
  }
}

function initAuth() {
  if (sessionStorage.getItem('kanban_auth') === '1') {
    document.getElementById('lock-screen').style.display = 'none';
    fetchTickets();
    connectRealtime();
  } else {
    setTimeout(() => document.getElementById('lock-input').focus(), 100);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
initAuth();
// Polling de backup a cada 60s (caso WS caia sem reconectar)
setInterval(fetchTickets, 60000);
</script>
